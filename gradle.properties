# ВНИМАНИЕ: org.gradle.java.home задаётся в ~/.gradle/gradle.properties (пользовательский,
# не коммитится) — этот файл читается и на CI, где windows-пути нет.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP2. Исторически был выключен ради Room 2.6.1 (несовместим с KSP2);
# Room 2.8.5 с KSP2 работает, а под KSP1 наоборот падает при экспорте схем
# (AbstractMethodError: старый kotlinx-serialization в KSP1-класспасе).
ksp.useKSP2=true
# Инкрементальный кэш KSP дважды ловил гонку снапшотов (локально и на CI,
# где за прогон собираются два варианта пакета). Отключаем: сборки чуть
# дольше, зато детерминированные.
ksp.incremental=false
