# Каталог версий: все версии зависимостей и плагинов проекта живут здесь.
# Dependabot (.github/dependabot.yml) присылает PR с обновлениями.
# Версии библиотек Compose без version.ref берутся из compose-bom.

[versions]
agp = "9.5.0"
# Версия Kotlin нужна только для compose-компилятора: при built-in Kotlin
# в AGP 9 версия KGP задаётся самим AGP.
kotlin = "2.4.21"
# KSP версионируется независимо от Kotlin (схема <kotlin>-<ksp> упразднена).
ksp = "2.3.12"
compose-bom = "2026.09.00"
core-ktx = "1.12.0"
core-splashscreen = "1.2.0"
lifecycle = "2.7.0"
activity-compose = "1.8.2"
appcompat = "1.8.0"
datastore = "1.3.0"
# Защита раздела «Документы»: системный диалог биометрии/кода блокировки.
biometric = "1.1.0"
exifinterface = "1.4.2"
navigation = "2.7.7"
hilt = "2.60.1"
hilt-navigation-compose = "1.1.0"
room = "2.8.5"
# Локальные напоминания-сводки о событиях дня: задачи WorkManager
# переживают перезагрузку, обновление и doze без BOOT-ресиверов
# и точных будильников.
work = "2.12.0"
coil = "2.7.0"
# Транспорт CalDAV: OkHttp — протокол WebDAV/CalDAV живёт поверх HTTP.
okhttp = "5.5.1"
# OAuth-токены Google Calendar API: GoogleAuthUtil из Play Services
# (Android-клиент OAuth, package + SHA-1; токен короткоживущий, кеш
# и обновление — внутри GoogleAuthUtil).
play-services-auth = "21.3.0"
# Парсеры, которые тянет вендоренный модуль richeditor-compose
# (см. README.md модуля): разбор HTML и markdown в RichTextState.
ksoup = "0.6.0"
jetbrains-markdown = "0.7.9"
desugar-jdk-libs = "2.1.5"
# Разбор iCalendar (VEVENT/RRULE) для CalDAV-синхронизации (Этап 0).
# Ветка 3.2.x — проверенная на Android; «наполняющая» часть календаря-данных
# полностью day-only (VALUE=DATE), таймзоны не затрагиваются.
ical4j = "3.2.19"
junit = "4.13.2"
json = "20260814"
androidx-test-junit = "1.3.0"
androidx-test-core = "1.7.0"
espresso = "3.7.0"
# JVM-тесты под Android (миграции Room). Версия >= 4.16 нужна для SDK 36.
robolectric = "4.16.1"
# ktlint — линтер Kotlin: используется как CLI-зависимость, не как плагин.
ktlint = "1.8.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
ical4j = { group = "org.mnode.ical4j", name = "ical4j", version.ref = "ical4j" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "play-services-auth" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
# Артефакты для вендоренного модуля richeditor-compose: Compose-части берутся
# из compose-bom, парсеры — с версиями выше.
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material = { group = "androidx.compose.material", name = "material" }
ksoup-html = { group = "com.mohamedrejeb.ksoup", name = "ksoup-html", version.ref = "ksoup" }
ksoup-entities = { group = "com.mohamedrejeb.ksoup", name = "ksoup-entities", version.ref = "ksoup" }
jetbrains-markdown = { group = "org.jetbrains", name = "markdown", version.ref = "jetbrains-markdown" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Запись календарных объектов (PUT/DELETE, этап 2) гоняем на реальном
# HTTP-стеке: MockWebServer закрепляет заголовки предусловий и коды.
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
