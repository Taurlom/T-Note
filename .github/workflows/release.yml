name: Release

# Публикует релиз по тегу vX.Y.Z: собирает подписанный APK, создаёт
# GitHub Release с описанием из CHANGELOG.md и прикреплённым APK.
# Перед публикацией — гейты: сверка тега с appVersionName, ktlint,
# юнит-тесты; секция в CHANGELOG.md обязательна.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Тег должен совпадать с appVersionName в app/build.gradle.kts,
      # иначе в релизе окажется APK с другой версией внутри, а имя
      # файла будет от тега.
      - name: Verify tag matches appVersionName
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с appVersionName=$APP_VERSION в app/build.gradle.kts"
            exit 1
          fi

      # Стиль до сборки: релиз не публикуется при нарушениях ktlint —
      # иначе красный по стилю коммит мог бы выпуститься (как v1.21.0).
      - name: Check code style (ktlint)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:ktlintCheck

      # Тесты до сборки: релиз не публикуется, если логика сломана.
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set — см. README «Релизы»"
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/timemanager-release.jks
          cat > keystore.properties <<EOF
          storeFile=signing/timemanager-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk apk.apk
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > mapping.txt.gz

      - name: Prepare artifacts
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="TNote-${VERSION}.apk"
          cp apk.apk "$APK"
          sha256sum "$APK" | cut -d' ' -f1 > "${APK}.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Описание релиза — из секции версии в CHANGELOG.md. Секции нет —
      # ошибка, а не заглушка: релиз без записи в CHANGELOG не выходит.
      - name: Extract changelog section
        run: |
          awk -v v="${{ steps.apk.outputs.version }}" \
            '/^## /{if (p) exit} $0 ~ "^## \\[" v "\\]" {p=1} p' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::В CHANGELOG.md нет секции \"## [${{ steps.apk.outputs.version }}]\" — добавьте её перед выпуском"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: T-Note ${{ steps.apk.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            mapping.txt.gz
          make_latest: true
