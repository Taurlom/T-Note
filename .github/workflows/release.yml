name: Release

# Публикует релиз по тегу vX.Y.Z: собирает подписанный APK, создаёт
# GitHub Release с описанием из CHANGELOG.md и прикреплённым APK.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set — см. README «Релизы»"
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/timemanager-release.jks
          cat > keystore.properties <<EOF
          storeFile=signing/timemanager-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare artifact
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="TNote-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | cut -d' ' -f1 > "${APK}.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          awk -v v="${{ steps.apk.outputs.version }}" \
            '/^## /{if (p) exit} $0 ~ "^## \\[" v "\\]" {p=1} p' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '## %s\n\nСм. CHANGELOG.md\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: T-Note ${{ steps.apk.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
          make_latest: true
